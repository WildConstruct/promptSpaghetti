[build]
  # Build from root to handle monorepo properly
  base = ""
  # pnpm is auto-detected and installed by Netlify, just run the build
  # Generate graph manifest before building client
  command = "pnpm install && cd packages/asset-browser && npm run prebuild && cd ../.. && pnpm --filter client build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20.11.0"
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"
  # Skip Netlify's automatic dependency installation
  # NPM_FLAGS removed
  # In production, keep client calls relative and use Netlify redirects below
  # If you prefer absolute API calls, set VITE_API_URL in the Netlify UI instead.
  # Enable analytics in production
  VITE_ANALYTICS_ENABLED = "true"
  # Disable debug mode in production
  VITE_DEBUG_MODE = "false"
  # Enable feature flags
  VITE_FEATURE_FLAGS_ENABLED = "true"
  # Disable framework detection
  NETLIFY_USE_YARN = "false"
  # Cache bust to force fresh build
  NETLIFY_CACHE_BUST = "v5-template-editor-fix"
  # Disable secrets scanning for .env.example and other false positives
  SECRETS_SCAN_OMIT_PATHS = ".env.example,docs/**,packages/*/dist/**,client/dist/**"
  # Omit Supabase URL from secrets scanning (it's a public URL, not a secret)
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_URL"

[build.processing]
  skip_processing = true

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.images]
  compress = true

# Prevent auto-cancellation
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "accelerometer=(), camera=(), microphone=(), geolocation=(), gyroscope=(), magnetometer=(), payment=(), usb=()"
    Cache-Control = "public, max-age=0, must-revalidate"
    # Balanced CSP: allow style attributes but disallow inline <style> tags
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://promptspaghettiserver-4ufybwvo6-wildconstructs-projects.vercel.app https://*.vercel.app; frame-ancestors 'none';"
    # Dry-run stricter CSP to surface any remaining violations (optional)
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://promptspaghettiserver-4ufybwvo6-wildconstructs-projects.vercel.app https://*.vercel.app; frame-ancestors 'none';"
    # To further tighten CSP (requires hashing/nonces for inline styles/scripts), consider:
    # Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://ps.wildconstruct.com:8000 https://ps.wildconstruct.com; frame-ancestors 'none';"

# Ensure HTML is never cached by browsers/CDN so new builds load immediately
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Cache hashed static assets aggressively (Vite outputs to /assets)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[dev]
  command = "pnpm --filter client dev"
  port = 3000
  targetPort = 3000
  framework = "#custom"

# Proxy API calls to the Vercel backend
[[redirects]]
  from = "/api/*"
  to = "https://promptspaghettiserver-4ufybwvo6-wildconstructs-projects.vercel.app/api/:splat"
  status = 200
  force = true

# Expose enhanced admin panel
[[redirects]]
  from = "/admin"
  to = "https://promptspaghettiserver-4ufybwvo6-wildconstructs-projects.vercel.app/api/admin-enhanced"
  status = 200
  force = true

# Handle admin panel routes
[[redirects]]
  from = "/admin/*"
  to = "https://promptspaghettiserver-4ufybwvo6-wildconstructs-projects.vercel.app/api/admin-:splat"
  status = 200
  force = true
# Stricter CSP for admin routes (no inline styles/scripts)
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://promptspaghettiserver-4ufybwvo6-wildconstructs-projects.vercel.app https://*.vercel.app; frame-ancestors 'none';"
