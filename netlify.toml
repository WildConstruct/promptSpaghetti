[build]
  # Build from root to handle monorepo properly
  base = ""
  # pnpm is auto-detected and installed by Netlify, just run the build
  # Generate graph manifest before building client
  command = "pnpm install && cd packages/asset-browser && npm run prebuild && cd ../.. && pnpm --filter client build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20.19.0"
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"
  # Skip Netlify's automatic dependency installation
  # NPM_FLAGS removed
  # In production, keep client calls relative and use Netlify redirects below
  # If you prefer absolute API calls, set VITE_API_URL in the Netlify UI instead.
  # Enable analytics in production
  VITE_ANALYTICS_ENABLED = "true"
  # Disable debug mode in production
  VITE_DEBUG_MODE = "false"
  # Enable feature flags
  VITE_FEATURE_FLAGS_ENABLED = "true"
  # Disable framework detection
  NETLIFY_USE_YARN = "false"
  # Cache bust to force fresh build
  NETLIFY_CACHE_BUST = "v12-exact-text-preservation"
  # Disable Netlify secrets scanning on known false-positive-heavy paths.
  # This repo contains many examples, tests, reports, and legacy artifacts that
  # are not deployable runtime inputs but can still trip smart detection.
  SECRETS_SCAN_OMIT_PATHS = ".env.example,README.md,CHANGELOG.md,CONTRIBUTING.md,LICENSE,CLAUDE*.md,QA-*.md,.claude/**,.windsurf/**,.github/**,api/**,docs/**,examples/**,legacy/**,load-tests/**,reports/**,sandboxes/**,tests/**,scripts/**,src/**,server/database/**,server/migrations/**,server/src/admin-panel*.ts,server/src/config/**,server/src/exporter.js,client/.env.example,client/public/CHANGELOG.md,client/src/**,client/dist/**,client/package-lock.json,packages/*/dist/**,packages/core/tests/**,packages/core/types/**,packages/core/docs/**,packages/core/services/**,packages/core/hooks/useMetadataExtraction.ts,packages/core/utils/**,packages/core/README.md,packages/core/components/AssetBrowser/**,packages/core/components/epic1/AGENTS.md,packages/core/components/epic1/asset-library/**,packages/core/components/epic1/examples/**,packages/asset-browser/src/**,packages/custom-node-sdk/**,assets/examples/**,performance-baselines/**,python-executor/**,tools/**,pnpm-lock.yaml,create-auth-tasks-batch.sh,packages/core/config/python-executor.ts,packages/core/config/python-executor.d.ts"
  # Omit known public or non-secret config keys from secrets scanning
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_URL,VITE_API_TIMEOUT,VITE_SENTRY_ENVIRONMENT,VITE_OPENROUTER_BASE_URL"

[build.processing]
  skip_processing = true

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.images]
  compress = true

# Prevent auto-cancellation
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "accelerometer=(), camera=(), microphone=(), geolocation=(), gyroscope=(), magnetometer=(), payment=(), usb=()"
    Cache-Control = "public, max-age=0, must-revalidate"
    # Balanced CSP: allow style attributes but disallow inline <style> tags
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://prompt-spaghetti-client.vercel.app https://*.vercel.app https://api.openai.com https://openrouter.ai https://fmdeahjfcxklvsfeibxa.supabase.co wss://fmdeahjfcxklvsfeibxa.supabase.co; frame-ancestors 'none';"
    # Dry-run stricter CSP to surface any remaining violations (optional)
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://prompt-spaghetti-client.vercel.app https://*.vercel.app https://api.openai.com https://openrouter.ai https://fmdeahjfcxklvsfeibxa.supabase.co wss://fmdeahjfcxklvsfeibxa.supabase.co; frame-ancestors 'none';"
    # To further tighten CSP (requires hashing/nonces for inline styles/scripts), consider:
    # Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://ps.wildconstruct.com:8000 https://ps.wildconstruct.com; frame-ancestors 'none';"

# Ensure HTML is never cached by browsers/CDN so new builds load immediately
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Cache hashed static assets aggressively (Vite outputs to /assets)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[dev]
  command = "pnpm --filter client dev"
  port = 3000
  targetPort = 3000
  framework = "#custom"

# Proxy API calls to the Vercel backend
[[redirects]]
  from = "/api/*"
  to = "https://prompt-spaghetti-client.vercel.app/api/:splat"
  status = 200
  force = true
