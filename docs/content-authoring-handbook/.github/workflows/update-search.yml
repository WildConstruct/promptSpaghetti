name: Update Search Index

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/content-authoring-handbook/part*/**/*.md'
      - 'docs/content-authoring-handbook/assets/examples/**'

jobs:
  update-search:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/content-authoring-handbook

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: docs/content-authoring-handbook/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for content changes
        id: content-check
        run: |
          # Check if any markdown files have been modified
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- part*/**/*.md assets/examples/** || echo "")
          if [ -n "$CHANGED_FILES" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changed files: $CHANGED_FILES"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No content changes detected"
          fi

      - name: Generate search index
        if: steps.content-check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "Generating search index..."
          npm run build:search
          echo "Search index generated successfully"

      - name: Validate search index
        if: steps.content-check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          # Validate search index structure
          node -e "
            const fs = require('fs');
            const index = JSON.parse(fs.readFileSync('assets/data/search-index.json', 'utf8'));
            
            console.log('Search index validation:');
            console.log('- Total documents:', index.documents.length);
            console.log('- Total terms:', Object.keys(index.terms).length);
            console.log('- Index size:', (fs.statSync('assets/data/search-index.json').size / 1024).toFixed(2) + 'KB');
            
            // Validate structure
            if (!index.documents || !index.terms) {
              throw new Error('Invalid search index structure');
            }
            
            // Check for minimum content
            if (index.documents.length < 20) {
              throw new Error('Search index has too few documents');
            }
            
            console.log('✅ Search index validation passed');
          "

      - name: Update search statistics
        if: steps.content-check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          # Generate search statistics
          node -e "
            const fs = require('fs');
            const path = require('path');
            
            const index = JSON.parse(fs.readFileSync('assets/data/search-index.json', 'utf8'));
            const stats = {
              lastUpdated: new Date().toISOString(),
              documentCount: index.documents.length,
              termCount: Object.keys(index.terms).length,
              indexSize: fs.statSync('assets/data/search-index.json').size,
              categories: {}
            };
            
            // Count documents by category
            index.documents.forEach(doc => {
              const category = doc.category || 'uncategorized';
              stats.categories[category] = (stats.categories[category] || 0) + 1;
            });
            
            fs.writeFileSync('assets/data/search-stats.json', JSON.stringify(stats, null, 2));
            console.log('Search statistics updated:', JSON.stringify(stats, null, 2));
          "

      - name: Commit updated search index
        if: steps.content-check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if [ -n "$(git status --porcelain assets/data/search-index.json assets/data/search-stats.json)" ]; then
            git add assets/data/search-index.json assets/data/search-stats.json
            git commit -m "chore: update search index and statistics
            
            - Updated search index with latest content changes
            - Generated search statistics for monitoring
            - Automated update by GitHub Actions
            
            [skip ci]"
            git push
            echo "Search index committed and pushed"
          else
            echo "No changes to search index"
          fi

      - name: Create search index artifact
        if: steps.content-check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: search-index-${{ github.sha }}
          path: |
            docs/content-authoring-handbook/assets/data/search-index.json
            docs/content-authoring-handbook/assets/data/search-stats.json
          retention-days: 7

      - name: Notify on search update
        if: steps.content-check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const stats = JSON.parse(fs.readFileSync('docs/content-authoring-handbook/assets/data/search-stats.json', 'utf8'));

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🔍 Search index updated automatically
              
              **Statistics:**
              - Documents: ${stats.documentCount}
              - Terms: ${stats.termCount}
              - Index size: ${(stats.indexSize / 1024).toFixed(2)}KB
              - Categories: ${Object.keys(stats.categories).join(', ')}
              
              The search functionality has been updated with the latest content changes.`
            })

      - name: Performance monitoring
        run: |
          # Monitor search index performance
          node -e "
            const fs = require('fs');
            const start = Date.now();
            
            // Simulate search operations
            const index = JSON.parse(fs.readFileSync('assets/data/search-index.json', 'utf8'));
            
            // Test search performance
            const searchTerms = ['generator', 'prompt', 'content', 'example', 'tutorial'];
            const results = searchTerms.map(term => {
              const startTime = Date.now();
              const matches = index.documents.filter(doc => 
                doc.title.toLowerCase().includes(term.toLowerCase()) ||
                doc.content.toLowerCase().includes(term.toLowerCase())
              );
              const endTime = Date.now();
              
              return {
                term,
                matches: matches.length,
                time: endTime - startTime
              };
            });
            
            console.log('Search Performance Test:');
            results.forEach(result => {
              console.log('  - Term:', result.term, '| Matches:', result.matches, '| Time:', result.time + 'ms');
            });
            
            const avgTime = results.reduce((sum, r) => sum + r.time, 0) / results.length;
            console.log('Average search time:', avgTime.toFixed(2) + 'ms');
            
            if (avgTime > 100) {
              console.log('⚠️  Search performance may be degraded');
            } else {
              console.log('✅ Search performance is good');
            }
          "
