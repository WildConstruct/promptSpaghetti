name: Build Content Authoring Handbook

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/content-authoring-handbook/**'
  pull_request:
    branches: [main]
    paths:
      - 'docs/content-authoring-handbook/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to GitHub Pages'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/content-authoring-handbook

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: docs/content-authoring-handbook/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for content changes
        id: check-changes
        run: |
          node assets/tools/version-tracker.js check
          echo "changed=$?" >> $GITHUB_OUTPUT

      - name: Update version on changes
        if: steps.check-changes.outputs.changed == '1'
        run: |
          node assets/tools/version-tracker.js update patch
          node assets/tools/version-tracker.js changelog

      - name: Build search index
        run: npm run build:search

      - name: Build web version
        run: npm run build:web

      - name: Build PDF version
        run: npm run build:pdf

      - name: Build EPUB version
        run: npm run build:epub

      - name: Build print version
        run: npm run build:print

      - name: Validate build outputs
        run: |
          test -f _build/web/index.html
          test -f _build/pdf/content-authoring-handbook.pdf
          test -f _build/epub/content-authoring-handbook.epub
          test -f _build/print/content-authoring-handbook.html
          echo "All build outputs validated successfully"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: handbook-build-${{ github.sha }}
          path: |
            docs/content-authoring-handbook/_build/
            docs/content-authoring-handbook/VERSION
            docs/content-authoring-handbook/CHANGELOG.md
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.deploy == 'true')
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/content-authoring-handbook/_build/web
          destination_dir: handbook
          cname: your-handbook-domain.com

      - name: Create release on version change
        if: github.ref == 'refs/heads/main' && steps.check-changes.outputs.changed == '1'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: handbook-v${{ steps.version.outputs.version }}
          release_name: Content Authoring Handbook v${{ steps.version.outputs.version }}
          body: |
            Automated release of Content Authoring Handbook

            ## Changes
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/docs/content-authoring-handbook/CHANGELOG.md) for detailed changes.

            ## Downloads
            - [Web Version](https://your-handbook-domain.com/handbook/)
            - [PDF Version](https://github.com/${{ github.repository }}/releases/download/handbook-v${{ steps.version.outputs.version }}/content-authoring-handbook.pdf)
            - [EPUB Version](https://github.com/${{ github.repository }}/releases/download/handbook-v${{ steps.version.outputs.version }}/content-authoring-handbook.epub)
          draft: false
          prerelease: false

      - name: Upload release assets
        if: github.ref == 'refs/heads/main' && steps.check-changes.outputs.changed == '1'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: docs/content-authoring-handbook/_build/pdf/content-authoring-handbook.pdf
          asset_name: content-authoring-handbook.pdf
          asset_content_type: application/pdf

      - name: Notify on build failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 Handbook build failed. Please check the logs and fix any issues.'
            })

      - name: Performance benchmarks
        run: |
          echo "Build Performance Metrics:"
          echo "Web build size: $(du -sh _build/web | cut -f1)"
          echo "PDF size: $(du -sh _build/pdf/*.pdf | cut -f1)"
          echo "EPUB size: $(du -sh _build/epub/*.epub | cut -f1)"
          echo "Total build size: $(du -sh _build | cut -f1)"

          # Store metrics for trending
          mkdir -p _metrics
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ),$(du -sb _build | cut -f1)" >> _metrics/build-size.csv

      - name: Update search index
        if: github.ref == 'refs/heads/main'
        run: |
          npm run build:search
          echo "Search index updated successfully"
