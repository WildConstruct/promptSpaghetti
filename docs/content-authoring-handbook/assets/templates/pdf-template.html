<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{TITLE}}</title>
    <style>
        /* PDF-specific styles */
        @page {
            size: A4;
            margin: 20mm;
            
            @top-left {
                content: "{{TITLE}}";
                font-size: 10pt;
                color: #666;
            }
            
            @top-right {
                content: "Page " counter(page);
                font-size: 10pt;
                color: #666;
            }
            
            @bottom-center {
                content: "Generated " date();
                font-size: 8pt;
                color: #999;
            }
        }
        
        @page :first {
            @top-left { content: none; }
            @top-right { content: none; }
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 12pt;
            line-height: 1.6;
            color: #333;
            max-width: none;
            margin: 0;
            padding: 0;
        }
        
        .title-page {
            page-break-after: always;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        
        .title-page h1 {
            font-size: 36pt;
            font-weight: bold;
            color: #0969da;
            margin-bottom: 20pt;
        }
        
        .title-page .subtitle {
            font-size: 18pt;
            color: #666;
            margin-bottom: 40pt;
        }
        
        .title-page .author {
            font-size: 16pt;
            margin-bottom: 10pt;
        }
        
        .title-page .version {
            font-size: 14pt;
            color: #666;
            margin-bottom: 10pt;
        }
        
        .title-page .date {
            font-size: 12pt;
            color: #999;
        }
        
        .toc-page {
            page-break-before: always;
            page-break-after: always;
        }
        
        .toc-page h1 {
            font-size: 24pt;
            color: #0969da;
            margin-bottom: 20pt;
            border-bottom: 2pt solid #0969da;
            padding-bottom: 10pt;
        }
        
        .toc-part {
            margin-bottom: 20pt;
        }
        
        .toc-part h3 {
            font-size: 16pt;
            color: #24292e;
            margin-bottom: 10pt;
            font-weight: 600;
        }
        
        .toc-part ul {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }
        
        .toc-part li {
            margin-bottom: 5pt;
            padding-left: 20pt;
            position: relative;
        }
        
        .toc-part li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #0969da;
        }
        
        .toc-part a {
            color: #0969da;
            text-decoration: none;
        }
        
        .chapter-page {
            page-break-before: always;
            margin-bottom: 40pt;
        }
        
        .chapter-title {
            font-size: 24pt;
            color: #0969da;
            margin-bottom: 20pt;
            padding-bottom: 10pt;
            border-bottom: 2pt solid #0969da;
        }
        
        .chapter-content h1 {
            font-size: 20pt;
            color: #24292e;
            margin-top: 20pt;
            margin-bottom: 10pt;
            page-break-after: avoid;
        }
        
        .chapter-content h2 {
            font-size: 18pt;
            color: #24292e;
            margin-top: 18pt;
            margin-bottom: 8pt;
            page-break-after: avoid;
        }
        
        .chapter-content h3 {
            font-size: 16pt;
            color: #24292e;
            margin-top: 16pt;
            margin-bottom: 8pt;
            page-break-after: avoid;
        }
        
        .chapter-content h4 {
            font-size: 14pt;
            color: #24292e;
            margin-top: 14pt;
            margin-bottom: 6pt;
            page-break-after: avoid;
        }
        
        .chapter-content p {
            margin-bottom: 10pt;
            text-align: justify;
            orphans: 2;
            widows: 2;
        }
        
        .chapter-content ul, .chapter-content ol {
            margin-bottom: 10pt;
            padding-left: 20pt;
        }
        
        .chapter-content li {
            margin-bottom: 5pt;
        }
        
        .chapter-content code {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 10pt;
            background: #f6f8fa;
            padding: 2pt 4pt;
            border-radius: 3pt;
            border: 1pt solid #e1e4e8;
        }
        
        .chapter-content pre {
            background: #f6f8fa;
            padding: 10pt;
            border-radius: 5pt;
            border: 1pt solid #e1e4e8;
            overflow-x: auto;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 10pt;
            line-height: 1.4;
            page-break-inside: avoid;
        }
        
        .chapter-content blockquote {
            margin: 10pt 0;
            padding: 10pt 15pt;
            border-left: 4pt solid #0969da;
            background: #f6f8fa;
            font-style: italic;
        }
        
        .chapter-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 10pt 0;
            page-break-inside: avoid;
        }
        
        .chapter-content th, .chapter-content td {
            border: 1pt solid #e1e4e8;
            padding: 8pt;
            text-align: left;
        }
        
        .chapter-content th {
            background: #f6f8fa;
            font-weight: 600;
        }
        
        .chapter-content a {
            color: #0969da;
            text-decoration: none;
        }
        
        .chapter-content a:hover {
            text-decoration: underline;
        }
        
        .chapter-content strong {
            font-weight: 600;
        }
        
        .chapter-content em {
            font-style: italic;
        }
        
        /* Interactive examples should be simplified for PDF */
        .interactive-example {
            border: 1pt solid #e1e4e8;
            border-radius: 5pt;
            padding: 10pt;
            margin: 10pt 0;
            background: #f6f8fa;
            page-break-inside: avoid;
        }
        
        .interactive-example::before {
            content: "💻 Interactive Example (see web version)";
            display: block;
            font-weight: 600;
            margin-bottom: 10pt;
            color: #0969da;
        }
        
        .interactive-example pre {
            background: #ffffff;
            border: 1pt solid #d1d5da;
        }
        
        /* Hide interactive-only elements */
        .search-container,
        .example-controls,
        .search-results,
        .nav-link:hover,
        .toast-message {
            display: none !important;
        }
        
        /* Footnotes */
        .footnote {
            font-size: 10pt;
            color: #666;
        }
        
        .footnotes {
            margin-top: 20pt;
            padding-top: 10pt;
            border-top: 1pt solid #e1e4e8;
        }
        
        .footnotes h3 {
            font-size: 14pt;
            margin-bottom: 10pt;
        }
        
        .footnotes ol {
            padding-left: 20pt;
        }
        
        .footnotes li {
            font-size: 10pt;
            margin-bottom: 5pt;
        }
        
        /* Page breaks */
        .page-break {
            page-break-before: always;
        }
        
        .avoid-break {
            page-break-inside: avoid;
        }
        
        /* Print-specific utilities */
        @media print {
            .no-print {
                display: none !important;
            }
            
            .print-only {
                display: block !important;
            }
            
            a[href]:after {
                content: " (" attr(href) ")";
                font-size: 10pt;
                color: #666;
            }
            
            a[href^="#"]:after,
            a[href^="javascript:"]:after {
                content: "";
            }
        }
    </style>
</head>
<body>
    {{CONTENT}}
</body>
</html>
