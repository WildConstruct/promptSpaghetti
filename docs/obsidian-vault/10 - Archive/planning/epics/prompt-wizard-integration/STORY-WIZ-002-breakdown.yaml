# Story Breakdown: Wizard UI Panel Component
# Original: STORY-WIZ-002 (13 points) → Split into 3 stories

stories:
  - id: STORY-WIZ-002A
    title: Wizard Panel Structure & Basic Functionality
    priority: P0
    points: 5
    sprint: 1
    description: |
      Create the fundamental panel structure and sliding mechanism for the wizard.
      Focus on core functionality without visual polish or animations.

    acceptance_criteria:
      - Given Randomizer is open, When clicking "+ Paste prompt", Then panel slides in from right
      - Given panel is open, When clicking X button, Then panel closes
      - Given panel is open, When pressing Escape, Then panel closes
      - Given panel has unsaved changes, When closing, Then show confirmation dialog
      - Given text pasted, When processing starts, Then show loading spinner
      - Given panel is open, When window resizes, Then panel maintains correct position

    technical_notes:
      - Create packages/core/components/PromptWizard/WizardPanel.tsx
      - Use basic CSS transitions for slide (no spring animations yet)
      - Implement panel state management (open/closed/loading)
      - Wire up to existing Randomizer component
      - Use existing Modal/Dialog patterns from codebase

    out_of_scope:
      - Complex animations
      - Resizable width
      - Visual polish
      - Theme support

  - id: STORY-WIZ-002B
    title: Span Display & Visual States
    priority: P0
    points: 5
    sprint: 2
    depends_on: STORY-WIZ-002A
    description: |
      Implement the span highlighting system with all visual states
      (locked/randomized/focused/error) and proper styling.

    acceptance_criteria:
      - Given spans detected, When displayed, Then each shows with appropriate background color
      - Given locked span, When rendered, Then show lock icon + neutral gray background
      - Given randomized span, When rendered, Then show dice icon + green background
      - Given span focused, When selected, Then show blue ring outline
      - Given overlapping spans, When detected, Then show red underline error state
      - Given long prompt, When displayed, Then text wraps properly with maintained highlights
      - Given span hovered, When mouse over, Then show subtle hover state

    technical_notes:
      - Implement span rendering engine
      - Create SpanHighlight component
      - Use CSS-in-JS for dynamic styling
      - Handle text wrapping edge cases
      - Implement icon system (Lock, Dice1 from lucide-react)

    visual_specifications:
      span_styles:
        locked: 'bg-zinc-800/30 border-zinc-700'
        randomized: 'bg-emerald-900/25 border-emerald-700'
        focused: 'ring-2 ring-sky-500'
        error: 'border-b-2 border-red-500 border-dashed'
      icons:
        size: '12px'
        position: 'inline-start with 2px margin'

  - id: STORY-WIZ-002C
    title: Panel Polish & Animations
    priority: P1
    points: 3
    sprint: 2
    depends_on: STORY-WIZ-002B
    description: |
      Add professional polish including smooth animations, theme support,
      responsive behavior, and accessibility features.

    acceptance_criteria:
      - Given panel opens, When animating, Then use spring animation (200ms ease-out)
      - Given panel is resizable, When dragging handle, Then smoothly adjust width 360px-600px
      - Given dark theme active, When panel renders, Then use appropriate dark theme colors
      - Given light theme active, When panel renders, Then use appropriate light theme colors
      - Given screen reader active, When panel opens, Then announce "Prompt wizard opened"
      - Given reduced motion preference, When set, Then disable animations
      - Given mobile viewport, When opened, Then panel takes full width

    technical_notes:
      - Implement react-spring for animations
      - Add resize handle with drag functionality
      - Connect to theme context
      - Add ARIA live regions
      - Implement responsive breakpoints
      - Add CSS custom properties for theming

    accessibility_requirements:
      - role="dialog" with aria-label
      - Focus trap when open
      - Escape key handling
      - Announce state changes
      - Respect prefers-reduced-motion

---
original_story_reference:
  id: STORY-WIZ-002
  original_points: 13
  new_total: 13 (5 + 5 + 3)
  rationale: |
    Split into logical layers:
    1. Structure first (can test functionality)
    2. Visual features second (can demo to stakeholders)
    3. Polish last (can defer if needed)

    This allows for incremental delivery and reduces risk. Each piece
    can be tested and approved independently.
