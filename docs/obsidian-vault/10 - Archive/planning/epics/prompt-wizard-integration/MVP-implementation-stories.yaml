# Prompt Wizard MVP Implementation Stories
# Product Owner: Sarah
# Based on: User research validation + PM review
# Sprint 1: 19 points total
# Date: 2025-01-09

epic:
  id: EPIC-WIZARD-MVP
  title: Prompt Wizard MVP - Research Validated
  description: |
    Minimal viable wizard with core features validated by 50 user interviews
    and 150 survey responses. Focuses on parse, highlight, preview, and 
    keyboard control as identified critical needs.
  success_criteria:
    - Parse time <200ms (p95)
    - 60% of parsed segments accepted unchanged
    - Time to first preset <2 minutes
    - 30% of users return within first week
  research_validation:
    - Pain score: 7.8/10 average
    - 94% would use with time savings
    - 66% rate live preview as P0
    - 48% rate keyboard shortcuts as P0

stories:

  - id: STORY-MVP-001
    title: Simple Prompt Parser
    points: 5
    priority: P0
    week: 1
    description: |
      Implement a simple, fast parser that splits prompts into segments
      using basic heuristics. Must meet performance expectations from
      user research.
    
    research_backing:
      - "If parsing takes more than 3 seconds, I might as well do it manually" - P09
      - 82% of users rate auto-detect as P0 feature
      - Users tolerate 30% error rate if easily correctable
    
    technical_requirements:
      - Use Web Worker to avoid blocking UI
      - Simple comma and conjunction splitting
      - Merge short segments (<3 words)
      - Handle quoted strings as single segment
      - Return structured span data with positions
    
    acceptance_criteria:
      - Given a 100-word prompt, When parsed, Then complete in <100ms
      - Given a 400-word prompt, When parsed, Then complete in <200ms
      - Given text with commas, When parsed, Then split at commas
      - Given text with "and/or/but", When parsed, Then split at conjunctions
      - Given "quoted text", When parsed, Then keep as single segment
      - Given segments <3 words, When detected, Then merge with adjacent
      - Given parsing error, When occurs, Then show user-friendly message
      - Given successful parse, When complete, Then return 4-8 segments average
    
    test_prompts:
      simple: "A red car, a blue sky, and green grass"
      complex: "Cinematic portrait of a young woman in vintage dress, soft natural light, shot on 35mm film"
      quoted: 'Use "exact phrase" in the prompt, then add variations'
      edge: "Multiple,,,commas,,,and...dots...everywhere!!!"
    
    definition_of_done:
      - [ ] Parser function implemented
      - [ ] Web Worker integration complete
      - [ ] Performance <200ms for 400 words
      - [ ] Unit tests pass with 90% coverage
      - [ ] Error handling implemented
      - [ ] Returns structured span objects

  - id: STORY-MVP-002
    title: Wizard Panel UI with Highlights
    points: 5
    priority: P0
    week: 1
    description: |
      Create the slide-in panel with visual span highlighting.
      Focus on clarity and immediate visual feedback as validated
      by user research.
    
    research_backing:
      - 74% positive reaction to auto-highlight concept
      - "Don't overthink it. Parse, highlight, let me fix. Ship it." - P08
      - Visual feedback critical for building trust
    
    ui_requirements:
      - Fixed-width panel (480px) sliding from right
      - Clear paste area with placeholder text
      - Highlighted spans with distinct visual treatment
      - Lock icon for locked spans (gray background)
      - Dice icon for randomized spans (green background)
      - Focus ring (blue) for selected span
      - Loading spinner during parse
    
    acceptance_criteria:
      - Given Randomizer open, When click "+ Paste prompt", Then panel slides in from right
      - Given panel open, When paste text, Then show loading spinner
      - Given parse complete, When displayed, Then show highlighted spans
      - Given locked span, When rendered, Then show lock icon + gray bg (#zinc-800/30)
      - Given randomized span, When rendered, Then show dice icon + green bg (#emerald-900/25)
      - Given span clicked, When selected, Then show blue focus ring
      - Given panel open, When press Escape, Then panel closes
      - Given long prompt, When displayed, Then text wraps with maintained highlights
    
    visual_specifications:
      panel:
        width: "480px"
        animation: "slide-in 200ms ease-out"
        background: "bg-zinc-900"
        padding: "24px"
      
      spans:
        locked:
          background: "bg-zinc-800/30"
          border: "border-zinc-700"
          icon: "Lock from lucide-react"
        randomized:
          background: "bg-emerald-900/25"
          border: "border-emerald-700"
          icon: "Dice1 from lucide-react"
        focused:
          ring: "ring-2 ring-sky-500"
      
      icons:
        size: "12px"
        margin: "2px"
    
    definition_of_done:
      - [ ] Panel component created
      - [ ] Slide animation working
      - [ ] Span highlighting implemented
      - [ ] Icons displaying correctly
      - [ ] Focus states working
      - [ ] Responsive text wrapping
      - [ ] Escape key closes panel

  - id: STORY-MVP-003
    title: Live Preview Panel
    points: 3
    priority: P0
    week: 2
    description: |
      Implement live preview showing the assembled prompt with
      randomization notation. This is the #1 requested feature
      from user research.
    
    research_backing:
      - Live preview ranked 4.53/5 (highest priority)
      - 66% rate as P0 (Must Have)
      - "Preview is non-negotiable. I need to see what chaos I'm about to unleash." - P35
      - "I can't tell if it's working until I run it. That's like cooking blindfolded." - P31
    
    ui_requirements:
      - Dock at bottom of wizard panel
      - Fixed height (120px)
      - Monospace font for clarity
      - Show {option1|option2} for randomized spans
      - Update in real-time as spans change
      - Visual separator from main panel
    
    acceptance_criteria:
      - Given wizard open, When spans detected, Then preview shows assembled prompt
      - Given locked span, When in preview, Then show as plain text
      - Given randomized span, When in preview, Then show as {original} notation
      - Given span toggled, When changed, Then preview updates immediately
      - Given boundary adjusted, When moved, Then preview reflects new text
      - Given multiple randomized spans, When shown, Then each has {} notation
      - Given preview text, When displayed, Then use monospace font
      - Given long preview, When displayed, Then wrap text appropriately
    
    preview_examples:
      input: "A happy dog in a sunny park"
      locked_all: "A happy dog in a sunny park"
      one_random: "A happy dog in a {sunny|bright|shaded} park"
      multi_random: "A {happy|playful|sleepy} dog in a {sunny|rainy|cloudy} park"
    
    definition_of_done:
      - [ ] Preview panel component created
      - [ ] Real-time updates working
      - [ ] {option} notation implemented
      - [ ] Monospace font applied
      - [ ] Text wrapping handled
      - [ ] Visual design matches spec
      - [ ] Performance: updates <50ms

  - id: STORY-MVP-004
    title: Keyboard Navigation with Arrow Keys
    points: 3
    priority: P0
    week: 2
    description: |
      Implement comprehensive keyboard navigation including arrow
      key boundary adjustment. Critical for power users and 
      addressing the #2 pain point of identifying boundaries.
    
    research_backing:
      - 48% rate keyboard shortcuts as P0
      - 80% want keyboard navigation for efficiency
      - "Keyboard shortcuts or death" - P07 (Power User)
      - "Identifying variable boundaries" - 31 mentions as pain point
      - "Like surgery with boxing gloves" - P28 on boundary adjustment
    
    keyboard_map:
      navigation:
        Tab: "Move to next span"
        Shift+Tab: "Move to previous span"
      
      modification:
        Space: "Toggle lock/randomize on focused span"
        Enter: "Edit/confirm current span"
        
      boundary_adjustment:
        ArrowLeft: "Move left boundary left by 1 token"
        ArrowRight: "Move right boundary right by 1 token"
        Shift+ArrowLeft: "Move left boundary left by 1 word"
        Shift+ArrowRight: "Move right boundary right by 1 word"
      
      general:
        Escape: "Close wizard panel"
        "?": "Show keyboard shortcuts help"
    
    acceptance_criteria:
      - Given span focused, When Space pressed, Then toggle lock/randomize state
      - Given wizard open, When Tab pressed, Then focus next span
      - Given wizard open, When Shift+Tab pressed, Then focus previous span
      - Given span focused, When Arrow Left pressed, Then left boundary moves left 1 token
      - Given span focused, When Arrow Right pressed, Then right boundary moves right 1 token
      - Given span focused, When Shift+Arrow pressed, Then boundary moves by word
      - Given boundaries overlap after adjustment, Then prevent and show error
      - Given boundary at text edge, Then prevent moving beyond
      - Given any action, When performed, Then preview updates immediately
      - Given ? pressed, When in wizard, Then show shortcuts overlay
    
    visual_feedback:
      - Focused span shows blue ring
      - Boundary being adjusted shows dotted line
      - Invalid adjustment shows red flash
      - Shortcuts overlay shows all commands
    
    definition_of_done:
      - [ ] All keyboard handlers implemented
      - [ ] Tab navigation working
      - [ ] Space toggle working
      - [ ] Arrow key boundaries working
      - [ ] Shift+Arrow word movement working
      - [ ] Boundary validation implemented
      - [ ] Visual feedback for all actions
      - [ ] Shortcuts help overlay created
      - [ ] No keyboard traps
      - [ ] Accessibility compliant

  - id: STORY-MVP-005
    title: PSG Node Generation
    points: 3
    priority: P0
    week: 2
    description: |
      Convert the configured spans into valid PSG nodes that
      can be imported into the main graph. Must generate
      correct node types and connections.
    
    research_backing:
      - Users want to go from "prompt to preset" quickly
      - Current manual process takes 32 minutes average
      - Must feel like "magic, even if it's not perfect" - P48
    
    technical_requirements:
      - Generate TextBlock for locked spans
      - Generate WeightedChoice for randomized spans
      - Create single Concat node joining all
      - Connect Concat to Output node
      - Calculate reasonable node positions
      - Include metadata for provenance
    
    node_generation_rules:
      locked_span:
        type: "TextBlock"
        data: "{ value: span.text }"
        meta: "{ source: 'wizard', confidence: span.confidence }"
      
      randomized_span:
        type: "WeightedChoice"
        data: "{ choices: [{ text: span.text, weight: 1 }] }"
        meta: "{ source: 'wizard', editable: true }"
      
      concat:
        type: "Concat"
        data: "{ separator: '' }"
        connections: "all spans in order"
      
      output:
        type: "Output"
        data: "{ template: '{input}' }"
        connection: "from concat"
    
    acceptance_criteria:
      - Given locked span, When converted, Then create TextBlock with exact text
      - Given randomized span, When converted, Then create WeightedChoice with original text
      - Given multiple spans, When converted, Then connect all to single Concat
      - Given Concat created, When connected, Then link to Output node
      - Given nodes generated, When positioned, Then no overlapping (50px min spacing)
      - Given PSG generated, When validated, Then pass graphSchema validation
      - Given metadata included, When generated, Then track wizard source
      - Given "Generate" clicked, When complete, Then close wizard panel
      - Given nodes added to graph, When displayed, Then appear in viewport
    
    validation_requirements:
      - All nodes have unique IDs
      - All edges properly connected
      - Graph has exactly one Output
      - No circular dependencies
      - PSG format version 2.0.0
    
    definition_of_done:
      - [ ] Node generation logic implemented
      - [ ] TextBlock creation working
      - [ ] WeightedChoice creation working
      - [ ] Concat assembly working
      - [ ] Output connection working
      - [ ] Position calculation implemented
      - [ ] PSG validation passing
      - [ ] Integration with main graph
      - [ ] Wizard closes after generation

sprint_summary:
  week_1:
    focus: "Parser and UI Foundation"
    stories: [STORY-MVP-001, STORY-MVP-002]
    points: 10
    deliverable: "Working panel with parsed highlights"
  
  week_2:
    focus: "Preview, Keyboard, and Generation"
    stories: [STORY-MVP-003, STORY-MVP-004, STORY-MVP-005]
    points: 9
    deliverable: "Complete wizard flow with all interactions"
  
  total_points: 19
  
  success_metrics:
    - 50+ users try in first week
    - <2 minute time to first preset
    - 60% parse acceptance rate
    - 30% return usage in week 1

risks:
  - Parse accuracy below 60% (Mitigation: Simple rules, easy correction)
  - Keyboard complexity (Mitigation: Start with essential shortcuts)
  - Performance issues (Mitigation: Web Worker, debouncing)
  - User confusion (Mitigation: Help overlay, tooltips)

dependencies:
  - Existing PSG node types
  - React Flow graph editor
  - Lucide React icons
  - graphSchema validation

team_notes:
  - Daily standups during sprint
  - User feedback collection from day 1
  - Performance monitoring critical
  - Accessibility review before launch
  - Consider feature flag for rollout