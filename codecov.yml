codecov:
  require_ci_to_pass: yes
  
coverage:
  precision: 2
  round: down
  range: "80...100"
  
  status:
    project:
      default:
        target: 80%
        threshold: 1%
      core:
        target: 90%
        paths:
          - "packages/core/runtime/**"
      validation:
        target: 95%
        paths:
          - "packages/core/validation.ts"
      server:
        target: 85%
        paths:
          - "server/src/engine.ts"
          - "server/src/engine.js"
      inspector:
        target: 80%
        paths:
          - "packages/core/components/Inspector/**"
    patch:
      default:
        target: 80%
        threshold: 1%

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: no
  require_base: no
  require_head: yes

ignore:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.test.js"
  - "**/*.test.jsx"
  - "**/__tests__/**"
  - "**/__mocks__/**"
  - "**/test/**"
  - "**/tests/**"
  - "**/spec/**"
  - "**/*.spec.ts"
  - "**/*.spec.js"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/coverage/**"
  - "**/.next/**"
  - "**/.turbo/**"
  - "**/jest.config.js"
  - "**/jest.setup.js"
  - "**/vite.config.ts"
  - "**/rollup.config.js"
  - "**/webpack.config.js"

flags:
  core:
    paths:
      - packages/core/**
    carryforward: true
  server:
    paths:
      - server/**
    carryforward: true
  client:
    paths:
      - client/**
    carryforward: true
  cli:
    paths:
      - packages/cli/**
    carryforward: true