<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Ticket Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e1e5e9;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            background: #1e1e2e;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            overflow: hidden;
            border: 1px solid #2d2d44;
        }

        .header {
            background: linear-gradient(135deg, #0f1419 0%, #1a1f29 100%);
            color: #e1e5e9;
            padding: 30px;
            text-align: center;
            position: relative;
            border-bottom: 1px solid #2d2d44;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #374151;
            color: #e1e5e9;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s;
        }

        .theme-toggle:hover {
            background: #4b5563;
        }

        /* Light Mode Styles */
        .light-mode {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }

        .light-mode .dashboard {
            background: white;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            border: 1px solid #e5e7eb;
        }

        .light-mode .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            border-bottom: 1px solid #e5e7eb;
        }

        .light-mode .theme-toggle {
            background: #4a5568;
            color: white;
        }

        .light-mode .theme-toggle:hover {
            background: #2d3748;
        }

        .light-mode .stats-bar {
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .light-mode .stat-number {
            color: #2c3e50;
        }

        .light-mode .stat-label {
            color: #6c757d;
        }

        .light-mode .controls {
            background: white;
            border-bottom: 1px solid #e9ecef;
        }

        .light-mode .control-group label {
            color: #495057;
        }

        .light-mode .control-group select,
        .light-mode .control-group input {
            background: white;
            border: 1px solid #ced4da;
            color: #495057;
        }

        .light-mode .control-group select:focus,
        .light-mode .control-group input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.2);
        }

        .light-mode .refresh-btn {
            background: #28a745;
        }

        .light-mode .refresh-btn:hover {
            background: #218838;
        }

        .light-mode .ticket {
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-left: 5px solid #6c757d;
        }

        .light-mode .ticket:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .light-mode .ticket.priority-auth {
            border-left-color: #dc3545;
            background: linear-gradient(135deg, #fff5f5 0%, #ffffff 100%);
        }

        .light-mode .ticket.priority-file {
            border-left-color: #28a745;
            background: linear-gradient(135deg, #f0fff4 0%, #ffffff 100%);
        }

        .light-mode .ticket.state-unassigned {
            border-left-color: #6c757d;
        }

        .light-mode .ticket.state-todo {
            border-left-color: #ffc107;
        }

        .light-mode .ticket.state-in_progress {
            border-left-color: #007bff;
        }

        .light-mode .ticket.state-review {
            border-left-color: #6f42c1;
        }

        .light-mode .ticket.state-completed {
            border-left-color: #28a745;
        }

        .light-mode .ticket.state-blocked {
            border-left-color: #dc3545;
        }

        .light-mode .ticket-id {
            background: #e9ecef;
            color: #495057;
        }

        .light-mode .state-todo {
            background: #fff3cd;
            color: #856404;
        }

        .light-mode .state-in_progress {
            background: #cce5ff;
            color: #004085;
        }

        .light-mode .state-review {
            background: #e2d9f3;
            color: #6f42c1;
        }

        .light-mode .state-completed {
            background: #d4edda;
            color: #155724;
        }

        .light-mode .state-blocked {
            background: #f8d7da;
            color: #721c24;
        }

        .light-mode .state-unassigned {
            background: #6c757d;
            color: white;
        }

        .light-mode .ticket-title {
            color: #2c3e50;
        }

        .light-mode .ticket-meta {
            color: #6c757d;
        }

        .light-mode .tag {
            background: #e7f3ff;
            color: #0066cc;
            border: 1px solid #cce5ff;
        }

        .light-mode .tag.tag-auth {
            background: #ffebee;
            color: #c62828;
            border-color: #ffcdd2;
        }

        .light-mode .tag.tag-file-browser {
            background: #e8f5e8;
            color: #2e7d32;
            border-color: #c8e6c8;
        }

        .light-mode .tag.tag-high-priority {
            background: #fff3e0;
            color: #f57c00;
            border-color: #ffe0b2;
        }

        /* Light mode fallback for malformed tag classes */
        .light-mode .tag[class*="tag-undefined"], 
        .light-mode .tag[class*="tag-null"], 
        .light-mode .tag[class*="tag-"] {
            background: #f3f4f6;
            color: #6b7280;
            border: 1px solid #d1d5db;
        }

        .light-mode .no-tickets {
            color: #6c757d;
        }

        .light-mode .loading {
            color: #6c757d;
        }

        .light-mode .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .light-mode .search-highlight {
            background: yellow;
            color: #333;
        }

        .light-mode .ticket-footer {
            border-top: 1px solid #e9ecef;
            color: #6c757d;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #252538;
            padding: 20px;
            border-bottom: 1px solid #2d2d44;
        }

        .stat {
            text-align: center;
            padding: 10px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #74c0fc;
        }

        .stat-label {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .controls {
            background: #1e1e2e;
            padding: 25px;
            border-bottom: 1px solid #2d2d44;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-size: 0.9rem;
            color: #d1d5db;
            font-weight: 500;
        }

        .control-group select,
        .control-group input {
            padding: 8px 12px;
            border: 1px solid #374151;
            border-radius: 5px;
            font-size: 0.9rem;
            background: #2d2d44;
            color: #e1e5e9;
        }

        .control-group select:focus,
        .control-group input:focus {
            outline: none;
            border-color: #74c0fc;
            box-shadow: 0 0 0 2px rgba(116, 192, 252, 0.2);
        }

        .refresh-btn {
            background: #059669;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s;
            align-self: end;
        }

        .refresh-btn:hover {
            background: #047857;
        }

        .tickets-container {
            max-height: 70vh;
            overflow-y: auto;
            padding: 20px;
        }

        .ticket-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }

        .ticket {
            background: #2d2d44;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            border-left: 5px solid #6b7280;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .ticket:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .ticket.priority-auth {
            border-left-color: #ef4444;
            background: linear-gradient(135deg, #3c1f1f 0%, #2d2d44 100%);
        }

        .ticket.priority-file {
            border-left-color: #10b981;
            background: linear-gradient(135deg, #1f3c26 0%, #2d2d44 100%);
        }

        .ticket.state-unassigned {
            border-left-color: #6b7280;
        }

        .ticket.state-todo {
            border-left-color: #f59e0b;
        }

        .ticket.state-in_progress {
            border-left-color: #3b82f6;
        }

        .ticket.state-review {
            border-left-color: #8b5cf6;
        }

        .ticket.state-completed {
            border-left-color: #10b981;
        }

        .ticket.state-blocked {
            border-left-color: #ef4444;
        }

        .ticket.state-error {
            border-left-color: #dc2626;
            background: #3c1917;
        }

        .state-error {
            background: #dc2626;
            color: white;
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .ticket-id {
            font-family: 'Courier New', monospace;
            background: #374151;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #d1d5db;
        }

        .ticket-state {
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .state-unassigned { background: #4b5563; color: white; }
        .state-todo { background: #f59e0b; color: #111827; }
        .state-in_progress { background: #3b82f6; color: white; }
        .state-review { background: #8b5cf6; color: white; }
        .state-completed { background: #10b981; color: white; }
        .state-blocked { background: #ef4444; color: white; }

        .ticket-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f3f4f6;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .ticket-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.9rem;
            color: #9ca3af;
            margin-bottom: 15px;
        }

        .ticket-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }

        .tag {
            background: #374151;
            color: #74c0fc;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            border: 1px solid #4b5563;
        }

        .tag.tag-auth { background: #3c1f1f; color: #fca5a5; border-color: #7f1d1d; }
        .tag.tag-file-browser { background: #1f3c26; color: #86efac; border-color: #166534; }
        .tag.tag-high-priority { background: #3c2a1f; color: #fdba74; border-color: #92400e; }

        /* Fallback for malformed or undefined tag classes */
        .tag[class*="tag-undefined"], .tag[class*="tag-null"], .tag[class*="tag-"] {
            background: #374151;
            color: #9ca3af;
            border: 1px solid #4b5563;
        }

        .no-tickets {
            text-align: center;
            color: #9ca3af;
            font-size: 1.2rem;
            margin: 50px 0;
        }

        .loading {
            text-align: center;
            color: #9ca3af;
            font-size: 1.1rem;
            margin: 50px 0;
        }

        .error {
            background: #3c1f1f;
            color: #fca5a5;
            padding: 15px;
            border-radius: 5px;
            margin: 20px;
            border: 1px solid #7f1d1d;
        }

        @media (max-width: 768px) {
            .ticket-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .stats-bar {
                flex-direction: column;
                gap: 10px;
            }
        }

        .priority-indicator {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.2rem;
        }

        .search-highlight {
            background: #fbbf24;
            color: #111827;
            padding: 1px 2px;
            border-radius: 2px;
        }

        .ticket-footer {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #374151;
            font-size: 0.85rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
            <h1>🎯 Visual Ticket Dashboard</h1>
            <p>Real-time view of all tasks and tickets in the system</p>
        </div>

        <div class="stats-bar" id="statsBar">
            <div class="stat">
                <div class="stat-number" id="totalTasks">-</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="unassignedTasks">-</div>
                <div class="stat-label">Available</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="inProgressTasks">-</div>
                <div class="stat-label">In Progress</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="authTasks">-</div>
                <div class="stat-label">Auth Tasks</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="fileTasks">-</div>
                <div class="stat-label">File Browser</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="completedTasks">-</div>
                <div class="stat-label">Completed</div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Filter by State</label>
                <select id="stateFilter">
                    <option value="">All States</option>
                    <option value="UNASSIGNED">Unassigned</option>
                    <option value="TODO">Todo</option>
                    <option value="IN_PROGRESS">In Progress</option>
                    <option value="REVIEW">Review</option>
                    <option value="COMPLETED">Completed</option>
                    <option value="BLOCKED">Blocked</option>
                </select>
            </div>

            <div class="control-group">
                <label>Filter by Priority</label>
                <select id="priorityFilter">
                    <option value="">All Priorities</option>
                    <option value="auth">Authentication (20.1)</option>
                    <option value="file-browser">File Browser (20.2)</option>
                    <option value="priority-automation">Priority Tasks</option>
                    <option value="high">High Priority</option>
                </select>
            </div>

            <div class="control-group">
                <label>Search Tasks</label>
                <input type="text" id="searchInput" placeholder="Search by title, ID, or assignee...">
            </div>

            <div class="control-group">
                <label>Sort by</label>
                <select id="sortBy">
                    <option value="priority">Priority</option>
                    <option value="created">Created Date</option>
                    <option value="updated">Updated Date</option>
                    <option value="assignee">Assignee</option>
                    <option value="state">State</option>
                </select>
            </div>

            <button class="refresh-btn" onclick="loadTasks()">🔄 Refresh Data</button>
        </div>

        <div class="tickets-container">
            <div id="loading" class="loading">Loading tickets...</div>
            <div id="ticketsGrid" class="ticket-grid" style="display: none;"></div>
            <div id="noTickets" class="no-tickets" style="display: none;">
                No tickets found matching your criteria.
            </div>
            <div id="error" class="error" style="display: none;"></div>
        </div>
    </div>

    <script>
        let allTasks = [];
        let filteredTasks = [];

        // Load tasks from the data file
        async function loadTasks() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('ticketsGrid').style.display = 'none';
                document.getElementById('noTickets').style.display = 'none';
                document.getElementById('error').style.display = 'none';

                // In a real environment, you'd fetch from an API endpoint
                // For now, we'll simulate loading from the state.json file
                const response = await fetch('./data/state.json');
                if (!response.ok) {
                    throw new Error(`Failed to load data: ${response.statusText}`);
                }
                
                const state = await response.json();
                
                // Convert tasks object to array
                allTasks = Object.entries(state.tasks || {}).map(([id, task]) => ({
                    ...task,
                    id: id
                }));

                updateStats();
                applyFilters();
                
                document.getElementById('loading').style.display = 'none';
                
            } catch (error) {
                console.error('Error loading tasks:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = `Error loading tasks: ${error.message}. 

💡 To use this dashboard:
1. Make sure you're running this from the project root directory
2. Start a local web server (e.g., python -m http.server 8000)
3. Open http://localhost:8000/src/visual-ticket-dashboard.html
4. The dashboard will load data from src/data/state.json`;
            }
        }

        // Update statistics
        function updateStats() {
            const stats = {
                total: allTasks.length,
                unassigned: allTasks.filter(t => t.state === 'UNASSIGNED' || (t.state === 'TODO' && (!t.assignee || t.assignee === 'Unassigned'))).length,
                inProgress: allTasks.filter(t => t.state === 'IN_PROGRESS').length,
                auth: allTasks.filter(t => t.tags?.includes('auth') || t.story?.includes('20.1')).length,
                file: allTasks.filter(t => t.tags?.includes('file-browser') || t.story?.includes('20.2')).length,
                completed: allTasks.filter(t => t.state === 'COMPLETED').length
            };

            document.getElementById('totalTasks').textContent = stats.total;
            document.getElementById('unassignedTasks').textContent = stats.unassigned;
            document.getElementById('inProgressTasks').textContent = stats.inProgress;
            document.getElementById('authTasks').textContent = stats.auth;
            document.getElementById('fileTasks').textContent = stats.file;
            document.getElementById('completedTasks').textContent = stats.completed;
        }

        // Apply filters and display tasks
        function applyFilters() {
            const stateFilter = document.getElementById('stateFilter').value;
            const priorityFilter = document.getElementById('priorityFilter').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const sortBy = document.getElementById('sortBy').value;

            filteredTasks = allTasks.filter(task => {
                // State filter
                if (stateFilter && task.state !== stateFilter) {
                    return false;
                }

                // Priority filter
                if (priorityFilter) {
                    switch (priorityFilter) {
                        case 'auth':
                            if (!task.tags?.includes('auth') && !task.story?.includes('20.1')) return false;
                            break;
                        case 'file-browser':
                            if (!task.tags?.includes('file-browser') && !task.story?.includes('20.2')) return false;
                            break;
                        case 'priority-automation':
                            if (task.metadata?.source !== 'priority-automation') return false;
                            break;
                        case 'high':
                            if (task.priority !== 'high') return false;
                            break;
                    }
                }

                // Search filter
                if (searchTerm) {
                    const searchableText = [
                        task.title,
                        task.id,
                        task.assignee,
                        task.description,
                        task.story,
                        ...(task.tags || [])
                    ].join(' ').toLowerCase();
                    
                    if (!searchableText.includes(searchTerm)) {
                        return false;
                    }
                }

                return true;
            });

            // Sort tasks
            filteredTasks.sort((a, b) => {
                switch (sortBy) {
                    case 'priority':
                        return getPriority(a) - getPriority(b);
                    case 'created':
                        return new Date(b.created || 0) - new Date(a.created || 0);
                    case 'updated':
                        return new Date(b.updated || 0) - new Date(a.updated || 0);
                    case 'assignee':
                        return (a.assignee || '').localeCompare(b.assignee || '');
                    case 'state':
                        return (a.state || '').localeCompare(b.state || '');
                    default:
                        return 0;
                }
            });

            displayTasks();
        }

        // Get priority score for sorting
        function getPriority(task) {
            if (task.tags?.includes('auth') || task.story?.includes('20.1')) return 1;
            if (task.tags?.includes('file-browser') || task.story?.includes('20.2')) return 2;
            if (task.metadata?.source === 'priority-automation') return 3;
            if (task.priority === 'high') return 4;
            return 5;
        }

        // Display filtered tasks
        function displayTasks() {
            const container = document.getElementById('ticketsGrid');
            const noTickets = document.getElementById('noTickets');
            
            if (filteredTasks.length === 0) {
                container.style.display = 'none';
                noTickets.style.display = 'block';
                return;
            }

            noTickets.style.display = 'none';
            container.style.display = 'grid';
            
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            container.innerHTML = filteredTasks.map(task => {
                try {
                    // Safely check task properties with fallbacks
                    const taskTags = (task.tags && Array.isArray(task.tags)) ? task.tags : [];
                    const taskState = String(task.state || 'unknown').toLowerCase();
                    const taskTitle = String(task.title || 'Untitled Task');
                    const taskId = String(task.id || 'Unknown-ID');
                    
                    const isAuth = taskTags.includes('auth') || (task.story && task.story.includes('20.1'));
                    const isFile = taskTags.includes('file-browser') || (task.story && task.story.includes('20.2'));
                    const priorityClass = isAuth ? 'priority-auth' : isFile ? 'priority-file' : '';
                    const stateClass = `state-${taskState.replace(/[^a-z0-9]/g, '-')}`;
                    
                    const priorityEmoji = isAuth ? '🔐' : isFile ? '📁' : task.priority === 'high' ? '🔥' : '📝';
                
                    // Highlight search terms safely
                    let displayTitle = taskTitle;
                    if (searchTerm) {
                        try {
                            const regex = new RegExp(`(${searchTerm})`, 'gi');
                            displayTitle = taskTitle.replace(regex, '<span class="search-highlight">$1</span>');
                        } catch (e) {
                            // If regex fails, just use the plain title
                            displayTitle = taskTitle;
                        }
                    }

                    return `
                        <div class="ticket ${priorityClass} ${stateClass}">
                            <div class="priority-indicator">${priorityEmoji}</div>
                            <div class="ticket-header">
                                <div class="ticket-id">${taskId}</div>
                                <div class="ticket-state state-${taskState}">${task.state || 'Unknown'}</div>
                            </div>
                            <div class="ticket-title">${displayTitle}</div>
                            <div class="ticket-meta">
                                <div><strong>Assignee:</strong> ${task.assignee || 'Unassigned'}</div>
                                <div><strong>Priority:</strong> ${task.priority || 'Normal'}</div>
                                <div><strong>Story:</strong> ${getStoryLabel(task)}</div>
                                <div><strong>Est. Time:</strong> ${task.est || 'N/A'} hrs</div>
                            </div>
                            ${(taskTags.length > 0) ? `
                                <div class="ticket-tags">
                                    ${taskTags.map(tag => {
                                        // Sanitize tag for CSS class
                                        const sanitizedTag = String(tag || '').replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
                                        const displayTag = String(tag || '').substring(0, 20); // Limit display length
                                        return `<span class="tag tag-${sanitizedTag}">${displayTag}</span>`;
                                    }).join('')}
                                </div>
                            ` : ''}
                            <div class="ticket-footer">
                                <div><strong>Created:</strong> ${formatDate(task.created)}</div>
                                <div><strong>Updated:</strong> ${formatDate(task.updated)}</div>
                            </div>
                        </div>
                    `;
                } catch (error) {
                    console.warn('Error rendering task:', task?.id || 'unknown', error);
                    // Return a safe fallback card for problematic tasks
                    return `
                        <div class="ticket state-error">
                            <div class="ticket-header">
                                <div class="ticket-id">${task?.id || 'Error-Task'}</div>
                                <div class="ticket-state state-error">ERROR</div>
                            </div>
                            <div class="ticket-title">⚠️ Task rendering error</div>
                            <div class="ticket-meta">
                                <div><strong>Issue:</strong> Unable to display task data</div>
                                <div><strong>ID:</strong> ${task?.id || 'unknown'}</div>
                            </div>
                        </div>
                    `;
                }
            }).join('');
        }

        // Get story label
        function getStoryLabel(task) {
            if (task.story?.includes('20.1')) return '🔐 Authentication';
            if (task.story?.includes('20.2')) return '📁 File Browser';
            if (task.story) return task.story;
            if (task.tags?.includes('auth')) return '🔐 Authentication';
            if (task.tags?.includes('file-browser')) return '📁 File Browser';
            return 'N/A';
        }

        // Format date
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        // Theme toggle functionality
        function toggleTheme() {
            const body = document.body;
            const button = document.querySelector('.theme-toggle');
            
            if (body.classList.contains('light-mode')) {
                body.classList.remove('light-mode');
                button.textContent = '🌙 Dark Mode';
                localStorage.setItem('theme', 'dark');
            } else {
                body.classList.add('light-mode');
                button.textContent = '☀️ Light Mode';
                localStorage.setItem('theme', 'light');
            }
        }

        // Load saved theme on page load
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            const body = document.body;
            const button = document.querySelector('.theme-toggle');
            
            if (savedTheme === 'light') {
                body.classList.add('light-mode');
                button.textContent = '☀️ Light Mode';
            } else {
                // Default to dark mode
                button.textContent = '🌙 Dark Mode';
            }
        }

        // Event listeners
        document.getElementById('stateFilter').addEventListener('change', applyFilters);
        document.getElementById('priorityFilter').addEventListener('change', applyFilters);
        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('sortBy').addEventListener('change', applyFilters);

        // Load tasks and theme on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            loadTasks();
        });

        // Auto-refresh every 30 seconds
        setInterval(loadTasks, 30000);
    </script>
</body>
</html>
