repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']
        
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(js|jsx|ts|tsx|json|md|yml|yaml)$
        
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.31.0
    hooks:
      - id: eslint
        files: \.(js|jsx|ts|tsx)$
        additional_dependencies:
          - eslint@8.57.0
          - eslint-config-airbnb@19.0.4
          - eslint-plugin-import@2.29.1
          - eslint-plugin-jsx-a11y@6.8.0
          - eslint-plugin-react@7.34.1
          - eslint-plugin-react-hooks@4.6.0
          - '@typescript-eslint/eslint-plugin@7.0.0'
          - '@typescript-eslint/parser@7.0.0'
          
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: (package-lock\.json|pnpm-lock\.yaml|\.git)
        
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.4.2
    hooks:
      - id: sqlfluff-lint
        files: \.sql$
        additional_dependencies: [sqlfluff-templater-jinja]
        
  - repo: local
    hooks:
      - id: typescript
        name: TypeScript Check
        entry: bash -c 'pnpm typecheck'
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false
        
      - id: test-related
        name: Run Related Tests
        entry: bash -c 'pnpm test -- --findRelatedTests'
        language: system
        files: \.(js|jsx|ts|tsx)$
        pass_filenames: true
        stages: [pre-commit]
        
      - id: security-audit
        name: Security Audit
        entry: bash -c 'pnpm audit --production --audit-level=high'
        language: system
        pass_filenames: false
        stages: [pre-push]
        
      - id: epic17-naming-conventions
        name: Epic 17 Naming Conventions Check
        entry: bash -c 'node scripts/check-naming-conventions.js'
        language: system
        files: \.(js|jsx|ts|tsx)$
        pass_filenames: true
        
      - id: epic17-security-check
        name: Epic 17 Security Pattern Check
        entry: bash -c 'node scripts/check-security-patterns.js'
        language: system
        files: \.(js|jsx|ts|tsx)$
        pass_filenames: true
        
      - id: epic17-api-documentation
        name: Epic 17 API Documentation Check
        entry: bash -c 'node scripts/check-api-documentation.js'
        language: system
        files: server/src/routes/.*\.ts$
        pass_filenames: true
        
      - id: no-console-logs
        name: Remove Console Logs
        entry: bash -c 'grep -rn "console\.\(log\|debug\|info\)" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" . && exit 1 || exit 0'
        language: system
        pass_filenames: false
        stages: [pre-commit]
        
      - id: database-migration-check
        name: Database Migration Safety Check
        entry: bash -c 'node scripts/check-migration-safety.js'
        language: system
        files: server/database/migrations/.*\.sql$
        pass_filenames: true