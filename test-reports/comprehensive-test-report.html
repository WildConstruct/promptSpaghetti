<!doctype html>
<html>
  <head>
    <title>Comprehensive Test Report</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .header {
        background: #f5f5f5;
        padding: 20px;
        border-radius: 5px;
      }
      .summary {
        display: flex;
        gap: 20px;
        margin: 20px 0;
      }
      .metric {
        background: #fff;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
        flex: 1;
      }
      .passed {
        color: #28a745;
      }
      .failed {
        color: #dc3545;
      }
      .skipped {
        color: #ffc107;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Comprehensive Test Report</h1>
      <p>Generated: 2025-07-22T08:20:50.070Z</p>
      <p>Duration: 0ms</p>
    </div>

    <div class="summary">
      <div class="metric">
        <h3>Total Tests</h3>
        <p>33</p>
      </div>
      <div class="metric">
        <h3 class="passed">Passed</h3>
        <p>30</p>
      </div>
      <div class="metric">
        <h3 class="failed">Failed</h3>
        <p>3</p>
      </div>
      <div class="metric">
        <h3>Success Rate</h3>
        <p>90.9%</p>
      </div>
    </div>

    <h2>Test Suites</h2>
    <table>
      <tr>
        <th>Suite</th>
        <th>Total</th>
        <th>Passed</th>
        <th>Failed</th>
        <th>Success Rate</th>
        <th>Duration</th>
      </tr>

      <tr>
        <td>edgeCases</td>
        <td>25</td>
        <td class="passed">23</td>
        <td class="failed">2</td>
        <td>92.0%</td>
        <td>0ms</td>
      </tr>

      <tr>
        <td>e2e</td>
        <td>8</td>
        <td class="passed">7</td>
        <td class="failed">1</td>
        <td>87.5%</td>
        <td>0ms</td>
      </tr>
    </table>
  </body>
</html>
