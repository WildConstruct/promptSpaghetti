name: CI

on:
  push:
    branches: [main, alpha, dev]
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Dependency Conflict Check
        run: |
          echo "🔍 Checking for critical dependency conflicts..."
          ZOD_VERSIONS=$(grep -r '"zod"' */package.json packages/*/package.json 2>/dev/null | grep -v node_modules | awk -F'"' '{print $4}' | sort -u | wc -l)
          if [ $ZOD_VERSIONS -gt 1 ]; then
            echo "❌ Zod version conflicts detected!"
            grep -r '"zod"' */package.json packages/*/package.json 2>/dev/null | grep -v node_modules
            echo "::error::Multiple Zod versions found. This can cause runtime validation issues."
            exit 1
          fi
          echo "✅ No critical dependency conflicts found"

      - name: Security Audit
        run: |
          echo "🔒 Running security audit..."
          pnpm audit --audit-level high || {
            echo "::warning::High severity vulnerabilities found. Please review."
          }

      - name: Lint
        run: pnpm lint
        # Using improved ESLint config with higher warning thresholds

      - name: Run tests with coverage
        run: pnpm test -- --coverage
        # Tests should pass for CI to succeed

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: success() || failure()

      - name: Build client
        run: pnpm --filter client build

      - name: Build server
        run: pnpm --filter server build

      - name: Docker build (server)
        run: docker build -t promptscape-server ./server
        # (Optional: push to GHCR)

      - name: Performance tests
        run: |
          pnpm --filter client dev &
          sleep 10
          npx playwright test --project=chromium || echo "Performance tests failed but not blocking CI"
          pkill -f "vite" || true
        continue-on-error: true
        # Performance tests run but don't block CI - results are informational
