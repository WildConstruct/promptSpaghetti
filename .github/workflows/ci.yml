name: CI

on:
  push:
    branches: [main, alpha, dev]
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Puppeteer
        run: pnpm exec puppeteer browsers install chrome

      - name: Build Content Authoring Handbook (PDF)
        run: pnpm --filter content-authoring-handbook run build:pdf

      - name: Source of truth guard (editor/nodes)
        run: |
          echo "Checking for quarantined imports and final editor references..."
          if grep -R -n "epic1/_quarantined" packages/core 2>/dev/null; then
            echo "::error::Quarantined editor referenced. Use Epic1GraphEditor (Monolithic) only."
            exit 1
          fi
          if grep -R -n "Epic1GraphEditorFinal" packages/core 2>/dev/null; then
            echo "::error::Do not import Epic1GraphEditorFinal.tsx. It is quarantined until repaired."
            exit 1
          fi
          echo "Source of truth guard passed."

      - name: Build server (early)
        run: pnpm --filter server build

      - name: Smoke server /health
        run: |
          node server/dist/index.js &
          SERVER_PID=$!
          sleep 2
          curl -sSf http://127.0.0.1:8000/health | jq . || curl -sSf http://127.0.0.1:8000/health
          kill $SERVER_PID || true

      - name: Dependency Conflict Check
        run: |
          echo "🔍 Checking for critical dependency conflicts..."
          ZOD_VERSIONS=$(grep -r '"zod"' */package.json packages/*/package.json 2>/dev/null | grep -v node_modules | awk -F'"' '{print $4}' | sort -u | wc -l)
          if [ $ZOD_VERSIONS -gt 1 ]; then
            echo "❌ Zod version conflicts detected!"
            grep -r '"zod"' */package.json packages/*/package.json 2>/dev/null | grep -v node_modules
            echo "::error::Multiple Zod versions found. This can cause runtime validation issues."
            exit 1
          fi
          echo "✅ No critical dependency conflicts found"

      - name: Security Audit
        run: |
          echo "🔒 Running security audit..."
          pnpm audit --audit-level high || {
            echo "::warning::High severity vulnerabilities found. Please review."
          }

      - name: Lint
        run: pnpm lint
        # Using improved ESLint config with higher warning thresholds

      - name: Run tests with coverage
        run: pnpm test -- --coverage
        # Tests should pass for CI to succeed

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: success() || failure()

      - name: Generate graph manifest
        env:
          MANIFEST_OPTIONAL: ${{ vars.MANIFEST_OPTIONAL || 'false' }}
        run: |
          set -e
          echo "📋 Generating graph manifest for demo assets..."
          if pnpm run generate:manifest; then
            echo "✅ Manifest generated successfully"
          else
            if [ "$MANIFEST_OPTIONAL" = "true" ]; then
              echo "::warning::Graph manifest generation failed but marked optional; continuing"
              exit 0
            else
              echo "::error::Graph manifest generation failed and is required. Set MANIFEST_OPTIONAL=true to continue in preview."
              exit 1
            fi
          fi
          if [ -f packages/asset-browser/public/graphs/manifest.json ]; then
            head -20 packages/asset-browser/public/graphs/manifest.json
          else
            echo "⚠️ No manifest generated (may be expected if no .psg files)"
          fi

      - name: Upload graph manifest artifact
        if: ${{ hashFiles('packages/asset-browser/public/graphs/manifest.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: graph-manifest
          path: packages/asset-browser/public/graphs/manifest.json
          if-no-files-found: ignore

      - name: Build client
        run: pnpm --filter client build

      - name: Verify client browser bundle (no Node shims)
        run: pnpm run verify:bundle

      - name: Build server
        run: pnpm --filter server build

      - name: Docker build (server)
        if: ${{ vars.BUILD_DOCKER == 'true' }}
        run: docker build -t promptscape-server ./server
        # (Optional: push to GHCR)

      - name: Install Playwright browsers (Chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Performance tests
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          pnpm --filter client dev &
          sleep 10
          npx playwright test --project=chromium || echo "Performance tests failed but not blocking CI"
          pkill -f "vite" || true
        continue-on-error: true
        # Performance tests run but don't block CI - results are informational
