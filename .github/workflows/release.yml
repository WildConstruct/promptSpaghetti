name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.3)'
        required: true
      prerelease:
        description: 'Is this a pre-release?'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.check_prerelease.outputs.is_prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"
          
      - name: Check if pre-release
        id: check_prerelease
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if [[ "$VERSION" =~ (alpha|beta|rc|pre) ]] || [ "${{ github.event.inputs.prerelease }}" == "true" ]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "🔬 This is a pre-release"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "🚀 This is a stable release"
          fi

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: validate-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.4
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run tests
        run: pnpm test
        
      - name: Run security scan
        run: pnpm test:security
        
      - name: Check parser quality
        if: needs.validate-version.outputs.is_prerelease == 'false'
        run: pnpm eval:ci
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          
      - name: Type check
        run: pnpm typecheck
        
      - name: Lint check
        run: pnpm lint
        
      - name: Build packages
        run: pnpm build

  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    needs: [validate-version, quality-gates]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.4
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Update versions
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          # Update root package.json
          npm version $VERSION --no-git-tag-version
          # Update workspace packages
          pnpm -r exec npm version $VERSION --no-git-tag-version
          
      - name: Build all packages
        run: pnpm build
        
      - name: Create tarball
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          tar -czf prompt-spaghetti-$VERSION.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=coverage \
            --exclude=.env* \
            client/dist \
            server/dist \
            packages/*/dist
            
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            prompt-spaghetti-*.tar.gz
            client/dist
            server/dist
            packages/*/dist

  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: validate-version
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          echo "# Release Notes for v$VERSION" > CHANGELOG_TEMP.md
          echo "" >> CHANGELOG_TEMP.md
          echo "## What's Changed" >> CHANGELOG_TEMP.md
          echo "" >> CHANGELOG_TEMP.md
          
          # Categorize commits
          echo "### Features" >> CHANGELOG_TEMP.md
          git log ${PREV_TAG}..HEAD --grep="feat:" --pretty="- %s (%h)" >> CHANGELOG_TEMP.md || echo "- No new features" >> CHANGELOG_TEMP.md
          echo "" >> CHANGELOG_TEMP.md
          
          echo "### Bug Fixes" >> CHANGELOG_TEMP.md
          git log ${PREV_TAG}..HEAD --grep="fix:" --pretty="- %s (%h)" >> CHANGELOG_TEMP.md || echo "- No bug fixes" >> CHANGELOG_TEMP.md
          echo "" >> CHANGELOG_TEMP.md
          
          echo "### Performance Improvements" >> CHANGELOG_TEMP.md
          git log ${PREV_TAG}..HEAD --grep="perf:" --pretty="- %s (%h)" >> CHANGELOG_TEMP.md || echo "- No performance improvements" >> CHANGELOG_TEMP.md
          echo "" >> CHANGELOG_TEMP.md
          
          echo "### Documentation" >> CHANGELOG_TEMP.md
          git log ${PREV_TAG}..HEAD --grep="docs:" --pretty="- %s (%h)" >> CHANGELOG_TEMP.md || echo "- No documentation updates" >> CHANGELOG_TEMP.md
          echo "" >> CHANGELOG_TEMP.md
          
          echo "### Dependencies" >> CHANGELOG_TEMP.md
          git log ${PREV_TAG}..HEAD --grep="deps:" --pretty="- %s (%h)" >> CHANGELOG_TEMP.md || echo "- No dependency updates" >> CHANGELOG_TEMP.md
          echo "" >> CHANGELOG_TEMP.md
          
          # Epic-specific changes
          if git log ${PREV_TAG}..HEAD --grep="epic-2" --pretty="%h" | head -1 > /dev/null; then
            echo "### Epic 2: Subtle Intelligence Layer" >> CHANGELOG_TEMP.md
            git log ${PREV_TAG}..HEAD --grep="epic-2" --pretty="- %s (%h)" >> CHANGELOG_TEMP.md
            echo "" >> CHANGELOG_TEMP.md
          fi
          
          echo "## Contributors" >> CHANGELOG_TEMP.md
          git log ${PREV_TAG}..HEAD --pretty="%an" | sort -u | sed 's/^/- @/' >> CHANGELOG_TEMP.md
          echo "" >> CHANGELOG_TEMP.md
          
          echo "## Full Changelog" >> CHANGELOG_TEMP.md
          echo "https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v$VERSION" >> CHANGELOG_TEMP.md
          
          # Output changelog for the release
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG_TEMP.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-version, build-and-publish, generate-changelog]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.validate-version.outputs.version }}
          name: Release v${{ needs.validate-version.outputs.version }}
          body: ${{ needs.generate-changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ needs.validate-version.outputs.is_prerelease == 'true' }}
          files: |
            prompt-spaghetti-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [validate-version, create-release]
    if: always()
    steps:
      - name: Send Discord notification
        if: success()
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          PRERELEASE="${{ needs.validate-version.outputs.is_prerelease }}"
          
          if [ "$PRERELEASE" == "true" ]; then
            TITLE="🔬 Pre-Release v$VERSION is now available!"
            COLOR=16776960
          else
            TITLE="🚀 Version v$VERSION has been released!"
            COLOR=65280
          fi
          
          curl -X POST ${{ secrets.DISCORD_WEBHOOK }} \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"$TITLE\",
                \"description\": \"Check out the latest release of Prompt Spaghetti!\",
                \"url\": \"https://github.com/${{ github.repository }}/releases/tag/v$VERSION\",
                \"color\": $COLOR,
                \"fields\": [
                  {
                    \"name\": \"Version\",
                    \"value\": \"v$VERSION\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"Type\",
                    \"value\": \"$([ \"$PRERELEASE\" == \"true\" ] && echo \"Pre-release\" || echo \"Stable\")\",
                    \"inline\": true
                  }
                ],
                \"footer\": {
                  \"text\": \"Prompt Spaghetti Release Bot\"
                },
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }"
            
      - name: Comment on merged PRs
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.validate-version.outputs.version }}';
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: `v${version}`
            });
            
            // Get PRs merged since last release
            const { data: commits } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: release.target_commitish,
              head: 'main'
            });
            
            const prNumbers = new Set();
            for (const commit of commits.commits) {
              const prMatch = commit.commit.message.match(/#(\d+)/);
              if (prMatch) {
                prNumbers.add(prMatch[1]);
              }
            }
            
            for (const prNumber of prNumbers) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `🎉 This PR has been included in [Release v${version}](https://github.com/${{ github.repository }}/releases/tag/v${version})`
              });
            }

  post-release-tasks:
    name: Post-Release Tasks
    runs-on: ubuntu-latest
    needs: [validate-version, create-release]
    if: success() && needs.validate-version.outputs.is_prerelease == 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Update documentation
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          
          # Update version in documentation
          sed -i "s/version: .*/version: $VERSION/g" docs/config.yml || true
          
          # Create version tag in docs
          echo "v$VERSION" >> docs/versions.txt
          
      - name: Create post-release PR
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: post-release updates for v${{ needs.validate-version.outputs.version }}"
          title: "Post-release updates for v${{ needs.validate-version.outputs.version }}"
          body: |
            ## Post-release updates
            
            This PR contains automated updates following the release of v${{ needs.validate-version.outputs.version }}:
            
            - [ ] Documentation version updates
            - [ ] Version tags in documentation
            - [ ] Changelog updates
            
            Please review and merge to complete the release process.
          branch: post-release-v${{ needs.validate-version.outputs.version }}
          labels: |
            automated
            post-release
            documentation