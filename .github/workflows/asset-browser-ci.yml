name: Asset Browser CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Test Asset Browser (includes prebuild)
        run: pnpm --filter @prompt/asset-browser test
      - name: Build Asset Browser (prebuild runs)
        run: pnpm --filter @prompt/asset-browser build
