name: Active Quality Lane

on:
  push:
    branches: [main, alpha, dev]
  pull_request:
    branches: [main, alpha, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  active-quality:
    name: Active Validation and Repo Hygiene
    runs-on: windows-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Active validation lane
        run: pnpm run validate:active

      - name: Active deploy packaging lane
        run: pnpm run validate:deploy:active

      - name: Unused code check
        run: pnpm run validate:unused

      - name: Circular dependency check
        run: pnpm run validate:cycles
