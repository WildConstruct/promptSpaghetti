name: Enhanced Quality Gates with Agent Utilities

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

jobs:
  pre-check-validation:
    name: Agent Productivity Pre-Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Full history for better analysis
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Initialize Agent Utilities
      run: |
        echo "Initializing agent productivity utilities..."
        mkdir -p src/data/logs
        chmod +x src/utils/*.js
        
    - name: Agent QA Pre-Check (REQUIRED)
      run: |
        echo "Running comprehensive QA pre-check..."
        node src/utils/QAPrecheck.js check --ci-mode
        
    - name: Code Quality Scanner
      run: |
        echo "Running code quality scan..."
        node src/utils/CodeQualityScanner.js scan --ci-mode --report
        
    - name: Generate Test Cases for Changed Files
      run: |
        echo "Generating test cases for modified code..."
        # Find changed files and generate tests
        git diff --name-only origin/main...HEAD | grep -E '\.(js|ts|jsx|tsx)$' | while read file; do
          if [[ "$file" == src/* ]] || [[ "$file" == packages/* ]]; then
            echo "Analyzing $file for test generation..."
            node src/utils/TestCaseGenerator.js analyze --file "$file" || true
          fi
        done
        
    - name: Health Monitor System Check
      run: |
        echo "Checking system health..."
        node src/utils/IntegrationHealthMonitor.js ci-check
        
    - name: Upload QA Reports
      uses: actions/upload-artifact@v3
      with:
        name: qa-reports
        path: |
          src/data/reports/
          src/data/quality/
        if-no-files-found: warn

  enhanced-code-quality:
    name: Enhanced Code Quality Checks
    runs-on: ubuntu-latest
    needs: pre-check-validation
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Initialize Agent Utilities
      run: |
        mkdir -p src/data/logs
        chmod +x src/utils/*.js
      
    - name: Conflict Detection Check
      run: |
        echo "Checking for potential merge conflicts..."
        node src/utils/ConflictResolutionAssistant.js detect --ci-mode
        
    - name: Enhanced ESLint with Auto-Fix
      run: |
        echo "Running enhanced ESLint analysis..."
        node src/utils/CodeQualityScanner.js eslint --auto-fix --ci-mode
        
    - name: TypeScript Enhanced Validation
      run: |
        echo "Running enhanced TypeScript checks..."
        node src/utils/QAPrecheck.js check --types typescript --strict
        
    - name: Security Pattern Detection
      run: |
        echo "Scanning for security vulnerabilities..."
        node src/utils/CodeQualityScanner.js security --ci-mode
        
    - name: Performance Impact Analysis
      run: |
        echo "Analyzing performance impact..."
        node src/utils/CodeQualityScanner.js performance --ci-mode
        
    - name: Generate Quality Dashboard
      run: |
        echo "Generating quality dashboard..."
        node src/utils/AgentProductivityDashboard.js generate-ci-report
        
    - name: Update Knowledge Base
      run: |
        echo "Updating knowledge base with findings..."
        node src/utils/KnowledgeBaseIndexer.js update --ci-mode || true

  comprehensive-testing:
    name: Comprehensive Test Coverage
    runs-on: ubuntu-latest
    needs: enhanced-code-quality
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Initialize Agent Utilities
      run: |
        mkdir -p src/data/logs
        chmod +x src/utils/*.js
      
    - name: Generate Missing Test Cases
      run: |
        echo "Generating comprehensive test cases..."
        # Find files lacking tests and generate them
        find src packages -name "*.js" -o -name "*.ts" | grep -v test | grep -v spec | while read file; do
          test_file="${file%.*}.test.${file##*.}"
          if [[ ! -f "$test_file" ]]; then
            echo "Generating tests for $file..."
            node src/utils/TestCaseGenerator.js generate --file "$file" --framework jest || true
          fi
        done
        
    - name: Run Enhanced Test Suite
      run: |
        echo "Running comprehensive test suite..."
        pnpm test:coverage || true
        
    - name: Test Coverage Analysis
      run: |
        echo "Analyzing test coverage with utilities..."
        node src/utils/QAPrecheck.js check --types coverage --threshold 80
        
    - name: Generate Test Report
      run: |
        echo "Generating comprehensive test report..."
        node src/utils/TestCaseGenerator.js report --ci-mode
        
    - name: Upload Test Reports
      uses: actions/upload-artifact@v3
      with:
        name: test-reports
        path: |
          coverage/
          src/data/test-generation/
        if-no-files-found: warn

  dependency-analysis:
    name: Enhanced Dependency Analysis
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Initialize Agent Utilities
      run: |
        mkdir -p src/data/logs
        chmod +x src/utils/*.js
      
    - name: Task Dependency Analysis
      run: |
        echo "Analyzing task dependencies..."
        node src/utils/TaskDependencyResolver.js analyze --ci-mode
        
    - name: Security Dependency Scan
      run: |
        echo "Enhanced security dependency scanning..."
        node src/utils/QAPrecheck.js check --types dependencies --security
        
    - name: License Compliance Check
      run: |
        echo "Checking license compliance..."
        node src/utils/CodeQualityScanner.js licenses --ci-mode

  performance-monitoring:
    name: Performance and Health Monitoring
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Initialize Agent Utilities
      run: |
        mkdir -p src/data/logs
        chmod +x src/utils/*.js
      
    - name: System Health Validation
      run: |
        echo "Validating system health..."
        node src/utils/IntegrationHealthMonitor.js validate --ci-mode
        
    - name: Performance Baseline Check
      run: |
        echo "Checking performance baselines..."
        node src/utils/AgentProductivityDashboard.js performance-check --ci-mode
        
    - name: Build Performance Analysis
      run: |
        echo "Analyzing build performance..."
        time pnpm --filter client build
        time pnpm --filter server build
        
    - name: Generate Performance Report
      run: |
        echo "Generating performance report..."
        node src/utils/IntegrationHealthMonitor.js report --ci-mode

  documentation-update:
    name: Automated Documentation Update
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Initialize Agent Utilities
      run: |
        mkdir -p src/data/logs
        chmod +x src/utils/*.js
      
    - name: Generate Updated Documentation
      run: |
        echo "Generating fresh documentation..."
        node src/utils/DocumentationAutoGenerator.js generate --full
        
    - name: Update Knowledge Base
      run: |
        echo "Updating knowledge base..."
        node src/utils/KnowledgeBaseIndexer.js index --full
        
    - name: Generate API Documentation
      run: |
        echo "Generating API documentation..."
        node src/utils/DocumentationAutoGenerator.js api-docs
        
    - name: Commit Documentation Updates
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        if [[ -n $(git status --porcelain) ]]; then
          git add docs/ README.md
          git commit -m "docs: Auto-update documentation [skip ci]

🤖 Generated with Agent Productivity Utilities

Co-Authored-By: Agent Utilities <noreply@github.com>" || true
          git push || true
        fi

  workload-analysis:
    name: Agent Workload Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Initialize Agent Utilities
      run: |
        mkdir -p src/data/logs
        chmod +x src/utils/*.js
      
    - name: Workload Balance Analysis
      run: |
        echo "Analyzing current workload distribution..."
        node src/utils/AgentWorkloadBalancer.js analyze --ci-mode
        
    - name: Task Estimation for PR
      run: |
        echo "Estimating effort for PR changes..."
        git diff --name-only origin/main...HEAD | while read file; do
          if [[ "$file" == src/* ]] || [[ "$file" == packages/* ]]; then
            echo "Estimating complexity for $file..."
            node src/utils/TaskEstimationImprover.js estimate-file --file "$file" || true
          fi
        done
        
    - name: Generate Workload Report
      run: |
        echo "Generating workload analysis report..."
        node src/utils/AgentWorkloadBalancer.js report --ci-mode

  final-quality-summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [pre-check-validation, enhanced-code-quality, comprehensive-testing, dependency-analysis]
    if: always()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Initialize Agent Utilities
      run: |
        mkdir -p src/data/logs
        chmod +x src/utils/*.js
      
    - name: Generate Final Quality Summary
      run: |
        echo "Generating comprehensive quality summary..."
        node src/utils/AgentProductivityDashboard.js ci-summary
        
    - name: Check Quality Gates Status
      run: |
        echo "Checking overall quality gate status..."
        
        # Check if any critical jobs failed
        if [[ "${{ needs.pre-check-validation.result }}" == "failure" ]]; then
          echo "❌ Pre-check validation failed"
          exit 1
        fi
        
        if [[ "${{ needs.enhanced-code-quality.result }}" == "failure" ]]; then
          echo "❌ Code quality checks failed"
          exit 1
        fi
        
        echo "✅ All quality gates passed!"
        
    - name: Post Quality Report to PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          
          let reportContent = '## 🚀 Quality Gate Report\n\n';
          reportContent += '### Job Status\n';
          reportContent += `- Pre-check Validation: ${{ needs.pre-check-validation.result == 'success' ? '✅' : '❌' }} ${{ needs.pre-check-validation.result }}\n`;
          reportContent += `- Code Quality: ${{ needs.enhanced-code-quality.result == 'success' ? '✅' : '❌' }} ${{ needs.enhanced-code-quality.result }}\n`;
          reportContent += `- Testing: ${{ needs.comprehensive-testing.result == 'success' ? '✅' : '❌' }} ${{ needs.comprehensive-testing.result }}\n`;
          reportContent += `- Dependencies: ${{ needs.dependency-analysis.result == 'success' ? '✅' : '❌' }} ${{ needs.dependency-analysis.result }}\n`;
          reportContent += '\n### Agent Productivity Utilities Used\n';
          reportContent += '- ✅ QA Pre-check validation\n';
          reportContent += '- ✅ Code quality scanning\n';
          reportContent += '- ✅ Test case generation\n';
          reportContent += '- ✅ Conflict detection\n';
          reportContent += '- ✅ Security scanning\n';
          reportContent += '- ✅ Performance analysis\n';
          reportContent += '\n*Generated by Agent Productivity Utilities*';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: reportContent
          });