name: Docs Handbook Build

on:
  push:
    paths:
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build-handbook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Puppeteer
        run: pnpm exec puppeteer browsers install chrome

      - name: Build handbook (PDF)
        run: pnpm --filter content-authoring-handbook run build:pdf

      - name: Upload handbook PDF
        if: ${{ success() && hashFiles('docs/content-authoring-handbook/_build/pdf/**/*.pdf') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: content-authoring-handbook-pdf
          path: docs/content-authoring-handbook/_build/pdf/**/*.pdf
          if-no-files-found: error
